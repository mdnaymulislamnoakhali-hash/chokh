<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chokh - চোখ</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>চোখ</h1>
      <p class="sub" data-i18n="tagline"></p>
    </header>

    <section class="timer">
      <p class="label" id="timer-label"></p>
      <p class="time" id="timer-time">--:--</p>
      <p class="paused" id="paused-note" hidden></p>
      <p class="today" id="today-line"></p>
    </section>

    <section>
      <h2 data-i18n="interval_h"></h2>
      <div class="seg" id="interval-seg" role="group">
        <button type="button" data-min="15"></button>
        <button type="button" data-min="20"></button>
        <button type="button" data-min="30"></button>
        <button type="button" data-min="45"></button>
        <button type="button" data-min="60"></button>
      </div>
      <p class="hint" data-i18n="minutes"></p>
    </section>

    <section>
      <h2 data-i18n="prefs_h"></h2>
      <div class="setting">
        <span id="l-sound" data-i18n="sound"></span>
        <button type="button" class="toggle" role="switch" aria-labelledby="l-sound" data-key="sound" aria-checked="false"><span class="knob"></span></button>
      </div>
      <div class="setting">
        <span id="l-autostart" data-i18n="autostart"></span>
        <button type="button" class="toggle" role="switch" aria-labelledby="l-autostart" data-key="autostart" aria-checked="false"><span class="knob"></span></button>
      </div>
      <div class="setting">
        <span id="l-water" data-i18n="water"></span>
        <button type="button" class="toggle" role="switch" aria-labelledby="l-water" data-key="water" aria-checked="false"><span class="knob"></span></button>
      </div>
      <div class="setting">
        <span id="l-posture" data-i18n="posture"></span>
        <button type="button" class="toggle" role="switch" aria-labelledby="l-posture" data-key="posture" aria-checked="false"><span class="knob"></span></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="lang_h"></h2>
      <div class="seg two" id="lang-seg" role="group">
        <button type="button" data-lang="bn">বাংলা</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </section>

    <section>
      <h2 data-i18n="pause_h"></h2>
      <div class="row">
        <button type="button" class="btn" id="pause-1" data-i18n="pause1"></button>
        <button type="button" class="btn" id="pause-2" data-i18n="pause2"></button>
      </div>
      <button type="button" class="btn solid" id="resume" data-i18n="resume" hidden></button>
    </section>

    <section>
      <button type="button" class="btn link" id="test-break" data-i18n="test"></button>
    </section>

    <footer>
      <p data-i18n="footer1"></p>
      <p data-i18n="footer2"></p>
    </footer>
  </main>
  <script src="common.js"></script>
  <script src="main.js"></script>
</body>
</html>
