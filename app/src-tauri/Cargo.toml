[package]
name = "chokh"
version = "0.1.0"
description = "Chokh - চোখ: 20-20-20 eye-care reminder"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }          # সিস্টেম ট্রে
tauri-plugin-single-instance = "2"                            # একসাথে দুটো কপি চলা ঠেকায়
tauri-plugin-autostart = "2"                                  # Windows চালু হলে অটো-স্টার্ট
tauri-plugin-notification = "2"                               # পানি/পশ্চার রিমাইন্ডারের নোটিফিকেশন
tauri-plugin-opener = "2"                                     # ফেসবুক পেজ ব্রাউজারে খোলা
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }  # স্থানীয় সময় (তারিখ/ঘণ্টা)

# .exe ছোট রাখার জন্য রিলিজ সেটিংস
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
